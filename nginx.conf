server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: cualquier ruta desconocida devuelve index.html (útil si añades React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # config.js cambia por entorno: que el navegador NO lo cachee
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}